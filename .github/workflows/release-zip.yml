name: Release ZIP

# Builds itrend_player.zip from custom_components/itrend_player and attaches it
# to the GitHub release. HACS downloads this file (zip_release), and GitHub
# counts the downloads of the attached file.
#
# - Runs automatically when a release is published.
# - Can be started manually for an existing release tag (e.g. v0.3.1) to
#   attach the ZIP to older releases as well.
# - On a newly published release it also appends the support line (PayPal and
#   star) to the release notes if it is missing. HACS and the Home Assistant
#   update dialog show these notes. Manual runs never touch the notes, so older
#   releases stay as they are.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build the ZIP from and attach it to (e.g. v0.3.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build ZIP (integration files at the ZIP root)
        run: |
          cd custom_components/itrend_player
          zip -r ../../itrend_player.zip . -x "*.pyc" -x "*__pycache__/*"

      - name: Check ZIP content
        run: |
          unzip -Z1 itrend_player.zip > zip_files.txt
          cat zip_files.txt
          grep -qx "manifest.json" zip_files.txt
          grep -qx "__init__.py" zip_files.txt

      - name: Attach ZIP to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" itrend_player.zip --clobber

      - name: Append the support line to the release notes
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          SUPPORT_LINE: "Enjoying the integration? Support me via PayPal: [paypal.me/itrend24](https://www.paypal.me/itrend24) or give the repo a ⭐."
        run: |
          gh release view "$TAG" --json body --jq .body > notes.md
          if grep -q "paypal.me/itrend24" notes.md; then
            echo "Support line already present"
          else
            printf '\n\n%s\n' "$SUPPORT_LINE" >> notes.md
            gh release edit "$TAG" --notes-file notes.md
          fi
